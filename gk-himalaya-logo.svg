<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 155">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F0D080"/>
      <stop offset="45%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Sparkle above centre peak -->
  <polygon points="200,2 201.8,8 208,8 202.8,12 204.8,18 200,14 195.2,18 197.2,12 192,8 198.2,8"
    fill="url(#g)" opacity="0.95"/>

  <!-- Left peak (behind centre) -->
  <polyline points="105,84 152,47 172,70 188,84"
    fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="143,57 152,47 161,56"
    fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Right peak (behind centre) -->
  <polyline points="212,84 228,70 248,47 295,84"
    fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="239,56 248,47 257,57"
    fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Centre peak (tallest) -->
  <polyline points="140,84 200,18 260,84"
    fill="none" stroke="url(#g)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Snow ridge lines -->
  <polyline points="192,32 200,18 208,32"
    fill="none" stroke="url(#g)" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="185,45 200,18 215,45"
    fill="none" stroke="url(#g)" stroke-width="1.2" stroke-linejoin="round" opacity="0.5"/>

  <!-- GK Himalaya -->
  <text x="200" y="113"
    font-family="'Playfair Display', Georgia, serif"
    font-size="38" font-weight="700"
    fill="url(#g)" text-anchor="middle" letter-spacing="0.5">GK Himalaya</text>

  <!-- — celebration — -->
  <line x1="58"  y1="128" x2="148" y2="128" stroke="url(#g)" stroke-width="1" opacity="0.85"/>
  <text x="200" y="132"
    font-family="'Playfair Display', Georgia, serif"
    font-size="13" font-style="italic"
    fill="url(#g)" text-anchor="middle" letter-spacing="4">celebration</text>
  <line x1="252" y1="128" x2="342" y2="128" stroke="url(#g)" stroke-width="1" opacity="0.85"/>
</svg>
